[package]
name = "fedi-credential-sdk-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for the fedi credential protocol crate."
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
sys-rng = ["fedi-credential-sdk-protocol/sys-rng"]

[dependencies]
fedi-credential-sdk-protocol.workspace = true
getrandom = { version = "0.4.2", features = ["wasm_js"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
