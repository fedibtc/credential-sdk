[package]
name = "blind-rsa-signatures-wasm-next"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the fedibtc blind RSA credential protocol crate."
license = "MIT"
repository = "https://github.com/fedibtc/blind-rsa-signatures-wasm"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blind-rsa-signatures = "0.17.1"
fedibtc-blind-rsa-signatures = { path = "../protocol", version = "0.1.0" }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
js-sys = "0.3"
nostr = "0.44.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
wasm-bindgen = "0.2"
