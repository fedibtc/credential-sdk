[package]
name = "fedibtc-blind-rsa-signatures"
version = "0.1.0"
edition = "2021"
description = "Rust-facing, stateless credential protocol API for issuing and verifying partially blinded credentials."
license = "MIT"
repository = "https://github.com/fedibtc/blind-rsa-signatures-wasm"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
