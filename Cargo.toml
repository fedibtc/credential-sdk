[package]
name = "blind-rsa-signatures-wasm"
repository = "https://github.com/fedibtc/blind-rsa-signatures-wasm"
version = "0.0.0"
edition = "2021"
description = "WebAssembly bindings for the blind-rsa-signatures Rust crate."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blind-rsa-signatures = "0.17.1"
crypto-bigint = "=0.7.0-rc.27"
der = { version = "=0.8.0-rc.10", features = ["oid"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
pkcs1 = "=0.8.0-rc.4"
pkcs8 = "=0.11.0-rc.10"
rsa = "=0.10.0-rc.15"
signature = "=3.0.0-rc.10"
spki = "=0.8.0-rc.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
sha2 = "0.10"
tsify = "0.5"
wasm-bindgen = "0.2"

[dev-dependencies]

[profile.release]
opt-level = "s"
